databaseChangeLog:
  - changeSet:
      id: 005-create-schedule
      author: polina
      changes:
        - createTable:
            tableName: schedule
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true

              - column:
                  name: group_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: teacher_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: course_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: lesson_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: schedule
            baseColumnNames: group_id
            referencedTableName: groups
            referencedColumnNames: id
            constraintName: fk_schedule_group

        - addForeignKeyConstraint:
            baseTableName: schedule
            baseColumnNames: teacher_id
            referencedTableName: teachers
            referencedColumnNames: id
            constraintName: fk_schedule_teacher

        - addForeignKeyConstraint:
            baseTableName: schedule
            baseColumnNames: course_id
            referencedTableName: course
            referencedColumnNames: id
            constraintName: fk_schedule_course